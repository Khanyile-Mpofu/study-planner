name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Prepare project
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          flutter create --org com.studyplanner --project-name study_planner --platforms android .
          rm -rf test
          sed -i 's/android:label="study_planner"/android:label="Study Planner"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk StudyPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: StudyPlanner.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Study Planner (build ${{ github.run_number }})
          files: StudyPlanner.apk
